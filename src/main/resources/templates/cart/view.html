<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Cart | SmartCart</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/customer-nav :: nav}"></div>

<div class="cart-wrapper">

    <!-- Empty Cart -->

    <div th:if="${#lists.isEmpty(items)}" class="empty-cart">

        <h1>Your Cart is Empty</h1>

        <p>
            Looks like you haven't added anything yet.
        </p>

        <a th:href="@{/products}" class="checkout-btn">
            Continue Shopping
        </a>

    </div>

    <!-- Cart -->

    <div th:unless="${#lists.isEmpty(items)}">

        <h1 class="cart-title">
            Shopping Cart
            <span class="cart-count"
                  th:text="'(' + ${#lists.size(items)} + ' Items)'">
            </span>
        </h1>

        <div class="cart-layout">

            <!-- LEFT SIDE -->

            <div class="cart-items">

                <div class="cart-card"
                     th:each="item : ${items}">

                    <!-- Product Image -->

                    <div class="cart-image">

                        <img th:src="${item.product.imageUrl}"
                             alt="Product">

                    </div>

                    <!-- Product Info -->

                    <div class="cart-info">

                        <h2 th:text="${item.product.name}">
                            Product Name
                        </h2>

                        <p class="stock">

                            ✅ In Stock

                        </p>

                        <p class="price">

                            ₹<span th:text="${#numbers.formatDecimal(item.product.price,1,2)}"></span>

                        </p>

                        <form class="qty-form"
                              th:action="@{/cart/items/{id}/update(id=${item.id})}"
                              method="post">

                            <label>Quantity</label>

                            <input type="number"
                                   name="quantity"
                                   min="1"
                                   th:value="${item.quantity}">

                            <button class="update-btn"
                                    type="submit">

                                Update

                            </button>

                        </form>

                    </div>

                    <!-- Right Side -->

                    <div class="cart-right">

                        <h3 class="subtotal">

                            ₹<span th:text="${#numbers.formatDecimal(item.product.price * item.quantity,1,2)}"></span>

                        </h3>

                        <form th:action="@{/cart/items/{id}/remove(id=${item.id})}"
                              method="post">

                            <button class="remove-btn"
                                    type="submit">

                                🗑 Remove

                            </button>

                        </form>

                    </div>

                </div>

            </div>

            <!-- RIGHT SIDE -->

            <div class="cart-summary">

                <h2>

                    Price Details

                </h2>

                <div class="summary-row">

                    <span>Items</span>

                    <span th:text="${#lists.size(items)}"></span>

                </div>

                <div class="summary-row">

                    <span>Delivery</span>

                    <span class="delivery">

                        FREE

                    </span>

                </div>

                <div class="summary-row">

                    <span>Discount</span>

                    <span class="delivery">

                        ₹0

                    </span>

                </div>

                <div class="summary-row total">

                    <span>Total</span>

                    <span>

                        ₹<span th:text="${#numbers.formatDecimal(total,1,2)}"></span>

                    </span>

                </div>

                <a th:href="@{/checkout}"
                   class="payment-btn">

                    Proceed to Payment →

                </a>

                <a th:href="@{/products}"
                   class="continue-btn">

                    ← Continue Shopping

                </a>

                <p class="secure-payment">

                    🔒 Secure Payments powered by Razorpay

                </p>

            </div>

        </div>

    </div>

</div>

</body>
</html>
