<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checkout — SmartCart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/customer-nav :: nav}"></div>

<div class="page-content page-content-wide">
    <h1>Checkout</h1>

    <div class="alert alert-error" th:if="${param.error}" th:text="${param.error[0]}"></div>

    <div class="checkout-layout">

        <!-- Order summary -->
        <div class="checkout-summary-card">
            <h2 class="dashboard-section-title" style="margin-top:0;">Order Summary</h2>

            <div class="checkout-item-row" th:each="item : ${cartItems}">
                <img th:if="${item.product.imageUrl != null}" th:src="${item.product.imageUrl}" class="table-thumb">
                <div th:unless="${item.product.imageUrl != null}" class="table-thumb table-thumb-placeholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                </div>
                <div class="checkout-item-info">
                    <div class="checkout-item-name" th:text="${item.product.name}"></div>
                    <div class="checkout-item-qty" th:text="'Qty: ' + ${item.quantity}"></div>
                </div>
                <div class="checkout-item-price"
                     th:text="'₹' + ${#numbers.formatDecimal(item.product.price * item.quantity, 1, 2)}"></div>
            </div>
        </div>

        <!-- Payment panel -->
        <div class="checkout-payment-card">
            <h2 class="dashboard-section-title" style="margin-top:0;">Payment</h2>

            <div class="checkout-total-row">
                <span>Total to pay</span>
                <span class="checkout-total-amount" th:text="'₹' + ${#numbers.formatDecimal(total, 1, 2)}"></span>
            </div>

            <button id="pay-now-btn" class="btn-primary btn-inline checkout-pay-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;vertical-align:-3px;margin-right:6px;"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                Pay with Razorpay
            </button>

            <div class="checkout-trust-row">
                <span>🔒 Secured by Razorpay</span>
                <span>256-bit encryption</span>
            </div>
        </div>

    </div>
</div>

<form id="razorpay-verify-form" th:action="@{/checkout/verify}" method="post" style="display:none;">
    <input type="hidden" id="razorpay_payment_id" name="razorpay_payment_id">
    <input type="hidden" id="razorpay_order_id" name="razorpay_order_id">
    <input type="hidden" id="razorpay_signature" name="razorpay_signature">
</form>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script th:inline="javascript">
    const options = {
        key: /*[[${razorpayKeyId}]]*/ '',
        amount: /*[[${amountInPaise}]]*/ 0,
        currency: "INR",
        name: "SmartCart",
        description: "Order Payment",
        order_id: /*[[${razorpayOrderId}]]*/ '',
        handler: function (response) {
            document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
            document.getElementById('razorpay_order_id').value = response.razorpay_order_id;
            document.getElementById('razorpay_signature').value = response.razorpay_signature;
            document.getElementById('razorpay-verify-form').submit();
        },
        theme: { color: "#F2A93B" }
    };
    const rzp = new Razorpay(options);

    document.getElementById('pay-now-btn').addEventListener('click', function (e) {
        e.preventDefault();
        rzp.open();
    });
</script>

</body>
</html>
