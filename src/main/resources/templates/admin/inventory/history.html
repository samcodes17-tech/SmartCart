<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Stock History — SmartCart Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/admin-nav :: nav}"></div>

<div class="page-content page-content-wide">
    <h1 th:text="'Stock History — ' + ${inventory.product.name}">Stock History</h1>

    <table class="data-table" th:if="${not #lists.isEmpty(transactions)}">
        <thead>
        <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Quantity</th>
            <th>Note</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${transactions}">
            <td th:text="${#temporals.format(t.transactionDate, 'dd MMM yyyy, HH:mm')}"></td>
            <td>
                <span class="status-badge status-ok" th:if="${t.type.name() == 'STOCK_IN'}">Stock In</span>
                <span class="status-badge status-low" th:if="${t.type.name() == 'STOCK_OUT'}">Stock Out</span>
            </td>
            <td th:text="${t.quantity}"></td>
            <td th:text="${t.note}"></td>
        </tr>
        </tbody>
    </table>

    <p th:if="${#lists.isEmpty(transactions)}" class="empty-state">
        No stock movements recorded yet for this product.
    </p>

    <a th:href="@{/admin/inventory}" class="btn-secondary" style="margin-top: 1.5rem; display: inline-block;">Back to Inventory</a>
</div>

</body>
</html>
