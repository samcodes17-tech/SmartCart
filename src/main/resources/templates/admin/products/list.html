<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products — SmartCart Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/admin-nav :: nav}"></div>

<div class="page-content page-content-wide">
    <div class="page-header-row">
        <h1>Products</h1>
        <a th:href="@{/admin/products/new}" class="btn-primary btn-inline">+ Add Product</a>
    </div>

    <div class="alert alert-error" th:if="${param.error}" th:text="${param.error[0]}"></div>

    <table class="data-table" th:if="${not #lists.isEmpty(products)}">
        <thead>
        <tr>
            <th></th>
            <th>Name</th>
            <th>SKU</th>
            <th>Category</th>
            <th>Price</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td>
                <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}" class="table-thumb">
                <div th:unless="${product.imageUrl != null}" class="table-thumb table-thumb-placeholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                </div>
            </td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.sku}"></td>
            <td th:text="${product.category != null ? product.category.name : '—'}"></td>
            <td th:text="'₹' + ${#numbers.formatDecimal(product.price, 1, 2)}"></td>
            <td class="table-actions">
                <a th:href="@{/admin/products/{id}/edit(id=${product.id})}">Edit</a>
                <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post"
                      onsubmit="return confirm('Delete this product?');">
                    <button type="submit" class="btn-link-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${#lists.isEmpty(products)}" class="empty-state">
        No products yet. Click "Add Product" to create your first one.
    </p>
</div>

</body>
</html>
