<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle} + ' — SmartCart Admin'">Product — SmartCart Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/admin-nav :: nav}"></div>

<div class="page-content">
    <h1 th:text="${pageTitle}">Add Product</h1>

    <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{${formAction}}" th:object="${productForm}" method="post"
          enctype="multipart/form-data" class="card-form">

        <div class="field">
            <label for="image">Product photo</label>
            <div class="image-upload-row">
                <img id="imagePreview" class="image-preview"
                     th:src="${currentImageUrl != null ? currentImageUrl : ''}"
                     th:style="${currentImageUrl == null ? 'display:none;' : ''}">
                <div id="imagePlaceholder" class="image-preview image-placeholder" th:style="${currentImageUrl != null ? 'display:none;' : ''}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                </div>
                <input type="file" id="image" name="image" accept="image/*" onchange="previewImage(event)">
            </div>
            <p class="field-hint">JPG or PNG, up to 5MB. Leave empty to keep the current photo.</p>
        </div>

        <div class="field">
            <label for="name">Product name</label>
            <input type="text" id="name" th:field="*{name}">
            <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="field">
            <label for="sku">SKU</label>
            <input type="text" id="sku" th:field="*{sku}">
            <div class="field-error" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></div>
        </div>

        <div class="field">
            <label for="price">Price (₹)</label>
            <input type="number" step="0.01" id="price" th:field="*{price}">
            <div class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>

        <div class="field">
            <label for="categoryId">Category</label>
            <select id="categoryId" th:field="*{categoryId}">
                <option value="">Select a category</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
            <div class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
        </div>

        <div class="field">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}" rows="4"></textarea>
        </div>

        <button type="submit" class="btn-primary btn-inline">Save Product</button>
        <a th:href="@{/admin/products}" class="btn-secondary">Cancel</a>
    </form>
</div>

<script>
    function previewImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
            document.getElementById('imagePreview').src = e.target.result;
            document.getElementById('imagePreview').style.display = 'block';
            document.getElementById('imagePlaceholder').style.display = 'none';
        };
        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
