<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categories — SmartCart Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/admin-nav :: nav}"></div>

<div class="page-content page-content-wide">
    <h1>Categories</h1>

    <div class="two-col">
        <div>
            <table class="data-table" th:if="${not #lists.isEmpty(categories)}">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cat : ${categories}">
                    <td th:text="${cat.name}"></td>
                    <td th:text="${cat.description}"></td>
                    <td class="table-actions">
                        <form th:action="@{/admin/categories/{id}/delete(id=${cat.id})}" method="post"
                              onsubmit="return confirm('Delete this category?');">
                            <button type="submit" class="btn-link-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <p th:if="${#lists.isEmpty(categories)}" class="empty-state">
                No categories yet — add one to get started.
            </p>
        </div>

        <div class="card-form-narrow">
            <h2>Add category</h2>
            <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
            <form th:action="@{/admin/categories}" th:object="${category}" method="post">
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" th:field="*{name}">
                    <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="field">
                    <label for="description">Description</label>
                    <textarea id="description" th:field="*{description}" rows="3"></textarea>
                </div>
                <button type="submit" class="btn-primary btn-inline">Add Category</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
