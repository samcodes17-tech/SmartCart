<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Payment Success</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="success-container">

    <h1>✅ Payment Successful</h1>

    <h3>Thank You For Shopping</h3>

    <br>

    <p>

        Payment ID

        <strong th:text="${paymentId}"></strong>

    </p>

    <p>

        Razorpay Order

        <strong th:text="${orderId}"></strong>

    </p>

    <br>

    <a th:href="@{/home}"
       class="btn-primary">

        Continue Shopping

    </a>

</div>

</body>

</html>
