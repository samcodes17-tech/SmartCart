<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Detail — SmartCart Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/admin-nav :: nav}"></div>

<div class="page-content page-content-wide">
    <h1 th:text="'Order #' + ${order.id}">Order</h1>
    <p class="auth-subtext">
        Customer: <strong th:text="${order.user.email}"></strong> —
        Placed <span th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy, HH:mm')}"></span>
    </p>

    <table class="data-table">
        <thead>
        <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Price at Purchase</th>
            <th>Subtotal</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.product.name}"></td>
            <td th:text="${item.quantity}"></td>
            <td th:text="'₹' + ${#numbers.formatDecimal(item.priceAtPurchase, 1, 2)}"></td>
            <td th:text="'₹' + ${#numbers.formatDecimal(item.priceAtPurchase * item.quantity, 1, 2)}"></td>
        </tr>
        </tbody>
    </table>

    <p style="margin-top: 1rem; font-size: 1.1rem;">
        <strong>Total: ₹<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></span></strong>
    </p>

    <div class="card-form-narrow" style="margin-top: 1.5rem; max-width: 320px;">
        <h2>Update Status</h2>
        <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post">
            <div class="field">
                <select name="status">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == order.status}"></option>
                </select>
            </div>
            <button type="submit" class="btn-primary btn-inline">Update</button>
        </form>
    </div>

    <a th:href="@{/admin/orders}" class="btn-secondary" style="margin-top: 1.5rem; display: inline-block;">Back to Orders</a>
</div>

</body>
</html>
