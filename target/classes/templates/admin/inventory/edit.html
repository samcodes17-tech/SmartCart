<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventory Settings — SmartCart Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/admin-nav :: nav}"></div>

<div class="page-content">
    <h1 th:text="'Inventory Settings — ' + ${inventory.product.name}">Inventory Settings</h1>
    <p class="auth-subtext">Currently <strong th:text="${inventory.quantityInStock}"></strong> units in stock.</p>

    <form th:action="@{/admin/inventory/{id}(id=${inventory.id})}" th:object="${settingsForm}" method="post" class="card-form">
        <div class="field">
            <label for="reorderLevel">Reorder level</label>
            <input type="number" id="reorderLevel" th:field="*{reorderLevel}" min="0">
            <div class="field-error" th:if="${#fields.hasErrors('reorderLevel')}" th:errors="*{reorderLevel}"></div>
        </div>

        <div class="field">
            <label for="supplierId">Supplier</label>
            <select id="supplierId" th:field="*{supplierId}">
                <option value="">No supplier assigned</option>
                <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"></option>
            </select>
        </div>

        <button type="submit" class="btn-primary btn-inline">Save Settings</button>
        <a th:href="@{/admin/inventory}" class="btn-secondary">Cancel</a>
    </form>
</div>

</body>
</html>
