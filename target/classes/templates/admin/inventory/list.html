<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventory — SmartCart Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/admin-nav :: nav}"></div>

<div class="page-content page-content-wide">
    <h1>Inventory</h1>

    <div class="alert alert-error" th:if="${param.error}" th:text="${param.error[0]}"></div>

    <table class="data-table" th:if="${not #lists.isEmpty(inventoryList)}">
        <thead>
        <tr>
            <th>Product</th>
            <th>SKU</th>
            <th>In Stock</th>
            <th>Reorder Level</th>
            <th>Supplier</th>
            <th>Status</th>
            <th>Adjust Stock</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="inv : ${inventoryList}">
            <td th:text="${inv.product.name}"></td>
            <td th:text="${inv.product.sku}"></td>
            <td th:text="${inv.quantityInStock}"></td>
            <td th:text="${inv.reorderLevel}"></td>
            <td th:text="${inv.supplier != null ? inv.supplier.name : '—'}"></td>
            <td>
                <span class="status-badge status-low" th:if="${inv.lowStock}">Low Stock</span>
                <span class="status-badge status-ok" th:unless="${inv.lowStock}">OK</span>
            </td>
            <td>
                <form th:action="@{/admin/inventory/{id}/stock-in(id=${inv.id})}" method="post" class="stock-adjust-form">
                    <input type="number" name="quantity" min="1" value="1" required>
                    <button type="submit" class="btn-mini btn-mini-in">Stock In</button>
                    <button type="submit" th:formaction="@{/admin/inventory/{id}/stock-out(id=${inv.id})}" class="btn-mini btn-mini-out">Stock Out</button>
                </form>
            </td>
            <td class="table-actions">
                <a th:href="@{/admin/inventory/{id}/edit(id=${inv.id})}">Settings</a>
                <a th:href="@{/admin/inventory/{id}/history(id=${inv.id})}">History</a>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${#lists.isEmpty(inventoryList)}" class="empty-state">
        No inventory records yet — add a product first, and one will be created automatically.
    </p>
</div>

</body>
</html>
