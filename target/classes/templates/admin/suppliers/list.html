<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Suppliers — SmartCart Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/admin-nav :: nav}"></div>

<div class="page-content page-content-wide">
    <h1>Suppliers</h1>

    <div class="two-col">
        <div>
            <table class="data-table" th:if="${not #lists.isEmpty(suppliers)}">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Contact Info</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${suppliers}">
                    <td th:text="${s.name}"></td>
                    <td th:text="${s.contactInfo}"></td>
                    <td class="table-actions">
                        <form th:action="@{/admin/suppliers/{id}/delete(id=${s.id})}" method="post"
                              onsubmit="return confirm('Delete this supplier?');">
                            <button type="submit" class="btn-link-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <p th:if="${#lists.isEmpty(suppliers)}" class="empty-state">
                No suppliers yet — add one to get started.
            </p>
        </div>

        <div class="card-form-narrow">
            <h2>Add supplier</h2>
            <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
            <form th:action="@{/admin/suppliers}" th:object="${supplier}" method="post">
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" th:field="*{name}">
                    <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="field">
                    <label for="contactInfo">Contact Info</label>
                    <input type="text" id="contactInfo" th:field="*{contactInfo}" placeholder="Phone, email, or address">
                </div>
                <button type="submit" class="btn-primary btn-inline">Add Supplier</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
