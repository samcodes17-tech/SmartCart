<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create account — SmartCart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-brand">
        <div class="auth-brand-content">
            <div class="auth-logo">Smart<span>Cart</span></div>
            <h1>Set up your account.</h1>
            <p>Takes less than a minute — then you're browsing the catalog or managing stock, depending on your role.</p>
        </div>
    </div>

    <div class="auth-form-side">
        <div class="auth-form-box">
            <h2>Create your account</h2>
            <p class="auth-subtext">Already registered? <a th:href="@{/login}">Log in instead</a></p>

            <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <form th:action="@{/register}" th:object="${registerForm}" method="post">
                <div class="field">
                    <label for="name">Full name</label>
                    <input type="text" id="name" th:field="*{name}">
                    <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}">
                    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}">
                    <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="field">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}">
                    <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>

                <button type="submit" class="btn-primary">Create account</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
